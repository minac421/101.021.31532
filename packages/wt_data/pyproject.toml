[project]
name = "wt-data"
version = "0.1.0"
description = "Market data connectors, local order books, raw recorder and data-quality checks"
requires-python = ">=3.12"
dependencies = [
    "wt-core",
    "msgspec>=0.18",
    "websockets>=15.0",
    "httpx>=0.27",
    "zstandard>=0.23",
    "sortedcontainers>=2.4",
]

[tool.uv.sources]
wt-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wt_data"]
