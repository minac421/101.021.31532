[project]
name = "wt-collector"
version = "0.1.0"
description = "Read-only Binance USD-M market data recorder (no API keys, never places orders)"
requires-python = ">=3.12"
dependencies = [
    "wt-core",
    "wt-data",
    "msgspec>=0.18",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
]

[project.scripts]
wt-collector = "wt_collector.__main__:main"

[tool.uv.sources]
wt-core = { workspace = true }
wt-data = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wt_collector"]
