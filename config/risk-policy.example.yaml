# =============================================================================
# AI Whale Trader — Capital Protection Policy (EXAMPLE / PROPOSAL v0.1)
# -----------------------------------------------------------------------------
# OWNED BY THE HUMAN OPERATOR. No automated component (Self-Learning Engine,
# Strategy Optimizer, Decision Engine, News/LLM) may create, modify or select it.
#
# Enforcement (docs/07-risk-management.md, section 10):
#   * the live policy lives OUTSIDE this repository and is signed with the owner's key;
#     the Risk Guardian and the Watchdog refuse to start on a missing/invalid signature
#     or a hash that differs from the row in cfg.risk_policies;
#   * tightening is effective immediately; loosening only after
#     governance.loosening_cooldown_hours (also enforced by a DB constraint);
#   * automated components may only apply multipliers in [0, 1] on top of these
#     limits — never above them.
#
# All percentages are of account equity unless stated otherwise. The numbers are
# conservative STARTING PROPOSALS for review; set the final values according to
# your capital and risk tolerance before any paper/canary run.
# =============================================================================

policy:
  version: 1
  owner_key_id: "operator-key-1"     # public key fingerprint of the human owner
  notes: "Initial conservative policy for paper and canary phases."

account:
  exchange: binance_usdm
  dedicated_sub_account: true
  position_mode: ONE_WAY             # dualSidePosition = false
  margin_type: ISOLATED
  multi_assets_mode: false
  max_exchange_leverage_setting: 5   # per-symbol leverage configured on the exchange (hard cap)
  api_key_requirements:
    withdrawals_enabled: false
    ip_whitelist_required: true

per_trade:
  risk_pct_target: 0.25              # loss at stop, incl. modeled stop slippage
  risk_pct_max: 0.50                 # hard cap; dynamic multipliers can only reduce
  stressed_loss_pct_max: 1.00        # loss if the stop slips by the stress assumption below
  stop_slippage_stress_bps:
    A: 30
    B: 80
  min_stop_distance:
    spread_multiple: 4
    atr_1m_multiple: 0.5
  max_stop_distance_pct: 6.0
  liquidation_buffer_multiple: 3.0   # |entry - liquidation| >= 3 x |entry - stop|
  require_exchange_side_stop: true
  stop_confirmation_timeout_s: 3     # stop must be confirmed (ALGO_UPDATE) or emergency exit
  stops_may_only_tighten: true
  reentry_cooldown_after_stop_min: 60

portfolio:
  max_open_positions: 4
  max_open_risk_pct: 1.5
  max_gross_exposure_x_equity: 2.0
  max_net_beta_exposure_x_equity: 1.5   # |sum(notional_i * beta_btc_i)|
  max_positions_per_symbol: 1
  max_positions_per_cluster: 2
  max_risk_per_cluster_pct: 0.75
  max_symbol_share_of_open_risk_pct: 40
  stressed_scenario:
    btc_shock_pct: -10
    assumed_alt_correlation: 0.9
    max_scenario_loss_pct: 4.0
  max_new_entries_per_hour: 3

loss_limits:
  daily:                         # UTC day, vs start-of-day equity, realized + unrealized
    caution_pct: -1.0            # -> CAUTION
    reduce_only_pct: -1.5        # -> REDUCE_ONLY until the next UTC day
    flatten_pct: -2.5            # -> FLATTEN, then HALTED (human reset)
  weekly:
    reduce_only_pct: -4.0        # -> REDUCE_ONLY, human review required to resume entries
  monthly:
    halt_pct: -8.0
  drawdown_from_peak:
    risk_halving_pct: -6.0       # risk multiplier 0.5
    halt_pct: -12.0              # HALTED, incident review mandatory
  consecutive_losses:
    cooldown_after: 4
    cooldown_minutes: 360
    post_cooldown_risk_multiplier: 0.5
    post_cooldown_trades: 5
  per_symbol:
    max_losses_per_day: 2        # then the symbol is blocked for 24h
  per_setup_family:
    suspend_after_rolling_r: -6.0   # over the last 20 trades; requires review

liquidity:
  tiers:
    A:
      min_quote_volume_24h_usd: 500000000
      max_spread_bps: 2
      min_depth_1pct_usd: 5000000
    B:
      min_quote_volume_24h_usd: 50000000
      max_spread_bps: 6
      min_depth_1pct_usd: 500000
    C:
      min_quote_volume_24h_usd: 10000000
      max_spread_bps: 15
      min_depth_1pct_usd: 100000
  tradable_tiers: [A, B]         # tier C = analysis only
  max_order_pct_of_depth_0_5pct: 10
  max_expected_slippage_bps:
    A: 3
    B: 8
  min_listing_age_days: 30
  allowed_underlying_types: [COIN]

decision_floors:                 # the optimizer may RAISE these, never lower them
  min_ev_r_lower: 0.10           # conservative expected value after costs, in R
  max_cost_fraction_of_expected_gain: 0.35   # fees + slippage + expected funding
  max_adverse_funding_rate_per_8h: 0.0010    # do not open against funding above this
  min_reward_to_risk: 1.2

events:
  macro_blackout_minutes_before: 30
  macro_blackout_minutes_after: 30
  high_impact_events: [FOMC, CPI, NFP, PCE]
  block_symbols_with_delisting_notice: true
  exchange_maintenance_state: REDUCE_ONLY
  unknown_news_state_in_event_window: CAUTION

data_health:
  max_market_data_staleness_s:
    focus: 5
    other: 30
  max_user_stream_silence_s: 60        # with open positions (keepalive/heartbeat based)
  max_clock_offset_ms:
    warn: 250
    reduce_only: 1000
  btc_feed_failure_state: REDUCE_ONLY  # global
  max_book_resyncs_per_10min: 3        # per symbol, else symbol REDUCE_ONLY
  min_symbol_quality_score: 0.95

execution:
  max_order_rejects_per_10min: 5       # -> REDUCE_ONLY + alert
  max_orders_per_minute: 30            # runaway-loop guard -> kill switch K1
  reserve_rate_limit_headroom_pct: 30  # reserved for protective and exit orders
  reconciliation_interval_s: 20
  unknown_position_action: PROTECT_THEN_REDUCE_ONLY

state_machine:
  auto_deescalation_hysteresis_minutes: 30
  auto_deescalation_allowed_from: [CAUTION, REDUCE_ONLY]   # FLATTEN/HALTED need a human
  caution_risk_multiplier: 0.5
  extreme_market_state: REDUCE_ONLY    # rely on exchange-side stops, do not panic-flatten

watchdog:
  required_for_new_entries: true       # no watchdog heartbeat => REDUCE_ONLY
  check_interval_s: 10
  unprotected_position_grace_s: 10
  trader_heartbeat_timeout_s: 60
  hard_daily_loss_flatten_pct: -3.0    # independent backstop beyond loss_limits.daily.flatten_pct
  max_gross_exposure_x_equity: 2.5     # independent backstop
  max_exchange_leverage_setting: 5

governance:
  loosening_cooldown_hours: 24
  no_loosening_within_hours_after_loss_halt: 72
  require_second_factor: true          # TOTP on the signing CLI
  require_incident_review_to_leave: [FLATTEN, HALTED]
  automated_components_may_modify: false   # informational; enforced by signatures, DB roles and CI
